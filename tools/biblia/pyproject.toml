[project]
name = "blivre"
version = "0.1.0"
description = "Importador da Bíblia Livre (BLIVRE) e parser de referências bíblicas em pt-BR"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blivre"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos em português usam acentos/travessões

[tool.pytest.ini_options]
testpaths = ["tests"]
